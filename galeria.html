<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria - Casa Social Reino Para Todos</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- FAIXA SUPERIOR IGUAL À HOME -->
<header class="gallery-header">
    <img src="img/logo.png" alt="Logo da Casa Social" class="gallery-logo">
    <h1>Galeria de Fotos</h1>
    <p>Casa Social Reino Para Todos</p>
</header>

<!-- BOTÃO DE VOLTAR -->
<div style="text-align: center; margin-top: 20px;">
    <a href="index.html" class="back-btn">⟵ Voltar para a Página Inicial</a>
</div>

<!-- SEÇÃO: IMAGENS DOS CURSOS -->
<section class="gallery-section">
    <h2 class="gallery-title">Imagens dos Cursos</h2>

    <div class="gallery-container">
        <img src="img/croche.jpg" alt="Aula de crochê">
        <img src="img/ingles.jpg" alt="Aula de inglês">
        <img src="img/reforco.jpg" alt="Aula de reforço escolar">
        <img src="img/dança.jpg" alt="Aula de dança">
        <img src="img/jiu.jpg" alt="Aula de jiu-jtsu">
    </div>
</section>

<!-- SEÇÃO: FOTOS DA CASA SOCIAL -->
<section class="gallery-section">
    <h2 class="gallery-title">Fotos da Casa Social</h2>

    <div class="gallery-container">
        <!-- Adicione mais fotos aqui -->
        <img src="img/aula.jpg" alt="Exemplo temporário">
        <img src="img/grupo.jpg" alt="Exemplo temporário">
        <img src="img/fotos.jpg" alt="Exemplo temporário">
    </div>
</section>

</body>
</html>
